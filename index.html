<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>هوای ایران — دستیار هوشمند هواشناسی</title>
  <meta name="description" content="دستیار گفتگومحور پیش‌بینی وضع هوای ایران، با قابلیت تحلیل هوشمند تا ۳۰ روز آینده بر پایه مدل‌های عددی و اقلیمی">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌤️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <div id="app">
    <!-- Header -->
    <header id="topbar">
      <div class="brand">
        <div class="brand-avatar">🌤️</div>
        <div>
          <h1>هوای ایران</h1>
          <span class="sub-status"><span class="status-dot"></span>دستیار خودمونی پیش‌بینی هوا</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="btn-clear" class="btn-ghost" title="گفتگوی تازه" aria-label="شروع مجدد گفتگو">
          <span class="btn-icon">↻</span>
          <span class="btn-text">گفتگوی تازه</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Stream -->
    <main id="chat-stream">
      <div id="messages" role="log" aria-live="polite">
        <!-- Messages will be injected here -->
      </div>
    </main>

    <!-- Chat Input Area -->
    <footer id="composer">
      <div class="composer-wrap">
        <button id="btn-send" class="send-btn" title="ارسال پیام" aria-label="ارسال">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>

        <textarea id="chat-input" rows="1" placeholder="هر چی می‌خوای بپرس... (مثلاً: فردا تهران هوا چطوره؟)" aria-label="پیام شما"></textarea>

        <button id="btn-gps" class="tool-btn" title="هوای موقعیت فعلی من (GPS)" aria-label="موقعیت فعلی">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        </button>
      </div>
      <div class="composer-footnote">
        پیش‌بینی ۱۶ روز اول مستقیم از ماهواره‌ها؛ روزهای بعد بر اساس ترند ماهانه (مثل اکیوودر)
      </div>
    </footer>
  </div>

  <div id="toast" role="status"></div>

  <script src="assets/app.js"></script>
</body>

</html>
